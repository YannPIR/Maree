        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

		<script>
document.addEventListener("DOMContentLoaded", function() {

    // 👉 Sélection des couches de marées QGIS2Web
    var niveaux = bounds_group;
	niveaux.removeLayer(layer_Chemin_64);
	niveaux.removeLayer(layer_Parking_63);
	niveaux.removeLayer(layer_spots_62);
	niveaux.removeLayer(layer_Vuesatellite_0);
	
    // 👉 cacher toutes les couches
    niveaux.eachLayer(function (layer) {
    map.removeLayer(layer);
	});
	let currentLayer = null;
	
    // 👉 données marée
    let marees = [];

    fetch("maree.json")
        .then(res => res.json())
        .then(data => marees = data);

    // 👉 format date local
    function formatLocalDate(date) {
        const pad = n => String(n).padStart(2, '0');

        return date.getFullYear() + "-" +
            pad(date.getMonth() + 1) + "-" +
            pad(date.getDate()) + "T" +
            pad(date.getHours()) + ":" +
            pad(date.getMinutes());
    }

    // 👉 trouve la marée la plus proche
    function findClosestDate(target, marees) {
        const targetTime = new Date(target).getTime();

        return marees.reduce((closest, current) => {
            return Math.abs(new Date(current.datetime) - targetTime) <
                   Math.abs(new Date(closest.datetime) - targetTime)
                ? current : closest;
        });
    }

    // 👉 trouver la couche correspondante
    function findClosestLayer(level, layers) {
        let bestLayer = null;
        let bestDiff = Infinity;

        layers.eachLayer(glayer => {
			
			const layer = glayer.getLayers()[0];
            const h = layer.feature.properties['hauteur'];
            if (h === undefined) return;

            const diff = Math.abs(h - level);

            if (diff < bestDiff) {
                bestDiff = diff;
                bestLayer = layer;
            }
        });

        return bestLayer;
    }

    // 👉 mise à jour de la carte
    function updateMap(datetimeInput) {
        if (!marees.length) return;

        const maree = findClosestDate(datetimeInput, marees);
        const level = maree.level;

        const bestLayer = findClosestLayer(level, niveaux);

        // enlever l'ancienne couche affichée
		if (currentLayer) {
			map.removeLayer(currentLayer);
		}

        // afficher la bonne couche
        if (bestLayer) {
            map.addLayer(bestLayer);
			currentLayer = bestLayer;
        }

        // afficher hauteur (1 décimale)
        document.getElementById("hauteurValue").textContent = level.toFixed(1);

        console.log("Date demandée :", datetimeInput);
        console.log("Date de marée utilisée :", maree.datetime);
        console.log("Hauteur réelle :", level);
    }

    // 👉 éléments
    const timeInput = document.getElementById("timeInput");
    const hourSlider = document.getElementById("hourSlider");

    // 👉 datetime → carte
    timeInput.addEventListener("change", function(e) {
        const date = new Date(e.target.value);

        if (!isNaN(date)) {
            const hours = date.getHours() + date.getMinutes() / 60;
            hourSlider.value = hours;
        }

        updateMap(e.target.value);
    });

    // 👉 slider → datetime
    hourSlider.addEventListener("input", function() {
        const date = new Date(timeInput.value);

        if (isNaN(date)) return;

        const hours = parseFloat(hourSlider.value);

        date.setHours(0, 0, 0, 0);
        date.setHours(Math.floor(hours));
        date.setMinutes(Math.floor((hours % 1) * 60));

        timeInput.value = formatLocalDate(date);

        updateMap(timeInput.value);
    });

});
</script>
