	<script>
document.addEventListener("DOMContentLoaded", function() {

    // 👉 tes couches QGIS2Web
    var niveaux = [
        lyr_Niveau_0_1,
        lyr_Niveau_1_2,
        lyr_Niveau_2_3,
        lyr_Niveau_3_4,
        lyr_Niveau_4_5,
        lyr_Niveau_5_6,
        lyr_Niveau_6_7,
        lyr_Niveau_7_8,
        lyr_Niveau_8_9,
        lyr_Niveau_9_10,
        lyr_Niveau_10_11,
        lyr_Niveau_11_12,
        lyr_Niveau_12_13,
        lyr_Niveau_13_14,
        lyr_Niveau_14_15,
        lyr_Niveau_15_16,
        lyr_Niveau_16_17,
        lyr_Niveau_17_18,
        lyr_Niveau_18_19,
        lyr_Niveau_19_20,
        lyr_Niveau_20_21,
        lyr_Niveau_21_22,
        lyr_Niveau_22_23,
        lyr_Niveau_23_24,
        lyr_Niveau_24_25,
        lyr_Niveau_25_26,
        lyr_Niveau_26_27,
        lyr_Niveau_27_28,
        lyr_Niveau_28_29,
        lyr_Niveau_29_30,
        lyr_Niveau_30_31,
        lyr_Niveau_31_32,
        lyr_Niveau_32_33,
        lyr_Niveau_33_34,
        lyr_Niveau_34_35,
        lyr_Niveau_35_36,
        lyr_Niveau_36_37,
        lyr_Niveau_37_38,
        lyr_Niveau_38_39,
        lyr_Niveau_39_40,
        lyr_Niveau_40_41,
        lyr_Niveau_41_42,
        lyr_Niveau_42_43,
        lyr_Niveau_43_44,
        lyr_Niveau_44_45,
        lyr_Niveau_45_46,
        lyr_Niveau_46_47,
        lyr_Niveau_47_48,
        lyr_Niveau_48_49,
        lyr_Niveau_49_50,
        lyr_Niveau_50_51,
        lyr_Niveau_51_52,
        lyr_Niveau_52_53,
        lyr_Niveau_53_54,
        lyr_Niveau_54_55,
        lyr_Niveau_55_56,
        lyr_Niveau_56_57,
        lyr_Niveau_57_58,
        lyr_Niveau_58_59,
        lyr_Niveau_59_60,
        lyr_Niveau_60_61
    ];

    // 👉 cacher toutes les couches sauf la première
    niveaux.forEach((layer, i) => {
        layer.setVisible(i === 0);
    });

    // 👉 données marée
    let marees = [];

    fetch("maree.json")
        .then(res => res.json())
        .then(data => marees = data);

    // 👉 format date local
    function formatLocalDate(date) {
        const pad = n => String(n).padStart(2, '0');

        return date.getFullYear() + "-" +
            pad(date.getMonth() + 1) + "-" +
            pad(date.getDate()) + "T" +
            pad(date.getHours()) + ":" +
            pad(date.getMinutes());
    }

    // 👉 trouve la marée la plus proche
    function findClosestDate(target, marees) {
        const targetTime = new Date(target).getTime();

        return marees.reduce((closest, current) => {
            return Math.abs(new Date(current.datetime) - targetTime) <
                   Math.abs(new Date(closest.datetime) - targetTime)
                ? current : closest;
        });
    }

    // 👉 trouver la couche correspondante
    function findClosestLayer(level, layers) {
        let bestLayer = null;
        let bestDiff = Infinity;

        layers.forEach(layer => {
            const source = layer.getSource();
            if (!source) return;

            const features = source.getFeatures();
            if (!features.length) return;

            const h = features[0].get('hauteur');
            if (h === undefined) return;

            const diff = Math.abs(h - level);

            if (diff < bestDiff) {
                bestDiff = diff;
                bestLayer = layer;
            }
        });

        return bestLayer;
    }

    // 👉 mise à jour de la carte
    function updateMap(datetimeInput) {
        if (!marees.length) return;

        const maree = findClosestDate(datetimeInput, marees);
        const level = maree.level;

        const bestLayer = findClosestLayer(level, niveaux);

        // cacher toutes les couches
        niveaux.forEach(l => l.setVisible(false));

        // afficher la bonne couche
        if (bestLayer) {
            bestLayer.setVisible(true);
        }

        // afficher hauteur (1 décimale)
        document.getElementById("hauteurValue").textContent = level.toFixed(1);

        console.log("Date demandée :", datetimeInput);
        console.log("Date de marée utilisée :", maree.datetime);
        console.log("Hauteur réelle :", level);
    }

    // 👉 éléments
    const timeInput = document.getElementById("timeInput");
    const hourSlider = document.getElementById("hourSlider");

    // 👉 datetime → carte
    timeInput.addEventListener("change", function(e) {
        const date = new Date(e.target.value);

        if (!isNaN(date)) {
            const hours = date.getHours() + date.getMinutes() / 60;
            hourSlider.value = hours;
        }

        updateMap(e.target.value);
    });

    // 👉 slider → datetime
    hourSlider.addEventListener("input", function() {
        const date = new Date(timeInput.value);

        if (isNaN(date)) return;

        const hours = parseFloat(hourSlider.value);

        date.setHours(0, 0, 0, 0);
        date.setHours(Math.floor(hours));
        date.setMinutes(Math.floor((hours % 1) * 60));

        timeInput.value = formatLocalDate(date);

        updateMap(timeInput.value);
    });

});
</script>
